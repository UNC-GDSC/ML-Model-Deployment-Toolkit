apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-model-config
data:
  MODEL_VERSION: "1.0.0"
  MODEL_TYPE: "sklearn"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  METRICS_ENABLED: "true"
  PROMETHEUS_PORT: "8000"
  STRUCTURED_LOGGING: "true"
  API_KEY_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  CORS_ENABLED: "true"
  CORS_ORIGINS: "*"
