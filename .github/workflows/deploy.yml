name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-aws:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[aws]')

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Deploy to AWS Lambda
      run: |
        cd templates/aws-lambda
        chmod +x deploy.sh
        ./deploy.sh
      env:
        PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        ENVIRONMENT: production

  deploy-gcp:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[gcp]')

    steps:
    - uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Deploy to Cloud Run
      run: |
        cd templates/gcp-cloud-run
        chmod +x deploy.sh
        ./deploy.sh
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        ENVIRONMENT: production

  deploy-vercel:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[vercel]')

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./templates/vercel
        vercel-args: '--prod'

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [deploy-aws, deploy-gcp, deploy-vercel]
    if: always()

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*
